services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smarthome}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-324215}
    ports:
      # 宿主机可能已装本地 MySQL，端口做成可配置；容器内仍走 mysql:3306
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-324215}@mysql:3306/${MYSQL_DATABASE:-smarthome}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      KNOWLEDGE_EMBEDDER: ${KNOWLEDGE_EMBEDDER:-hash}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-tongyi-embedding-vision-flash-2026-03-06}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      KNOWLEDGE_VECTOR_BACKEND: ${KNOWLEDGE_VECTOR_BACKEND:-json}
      KNOWLEDGE_DATA_DIR: seed_data
    ports:
      - "8000:8000"
    volumes:
      # 语料挂载：改文档后只需重新索引，不用重建镜像
      - ./seed_data:/app/seed_data:ro
      # 开发期挂载源码：改代码后 restart 即可生效
      - ./backend:/app/backend:ro
      - ./app:/app/app:ro
      # 向量索引持久化：容器重建后不必重新 embedding 全部语料
      - knowledge_index:/app/.data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mysql_data:
  knowledge_index:

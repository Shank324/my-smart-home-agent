# 生产用 Nginx：静态资源 + 反代 API/WebSocket
# 关键点：/ws/ 必须显式放行 Upgrade 头，否则 WebSocket 握手会退化成普通请求

upstream smart_home_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带哈希的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://smart_home_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 带工具的对话可能跑十几秒，别让网关先超时
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://smart_home_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket 是长连接，读超时要远大于普通请求
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 单页应用：找不到文件就回 index.html，避免刷新 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}

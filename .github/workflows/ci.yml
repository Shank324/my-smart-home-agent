name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端（lint + 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: 静态检查
        run: |
          pip install ruff
          ruff check backend app scripts eval tests

      - name: 单元测试
        env:
          # 测试用 SQLite + 本地 hash embedding，不依赖 MySQL / Redis / 外部 API
          DATABASE_URL: sqlite:///./ci.db
          KNOWLEDGE_EMBEDDER: hash
          KNOWLEDGE_VECTOR_BACKEND: json
          KNOWLEDGE_QUERY_REWRITE: "0"
          DEEPSEEK_API_KEY: ""
        run: |
          python -m pytest tests -q \
            --cov=backend --cov=app --cov-report=term --cov-report=xml

      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npx vue-tsc --noEmit -p tsconfig.app.json

      - name: 生产构建
        run: npm run build
